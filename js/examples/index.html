<!doctype html>
<meta charset="utf-8">
<title>weave.js examples</title>
<!-- Open this file in a browser. No server, no build. -->
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 40px auto; max-width: 720px; padding: 0 16px; background: #f6f7f9; color: #1c2430; }
  section { background: #fff; border: 1px solid #e3e7ec; border-radius: 12px; padding: 20px; margin: 16px 0; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid #c9d0d8; background: #fff; cursor: pointer; }
  #box { width: 60px; height: 60px; border-radius: 12px; background: #2b6cb0; margin: 16px 0; }
  .card { padding: 10px 14px; border: 1px solid #e3e7ec; border-radius: 8px; margin: 6px 0; background: #fbfcfd; }
  .bar { height: 10px; background: #e3e7ec; border-radius: 5px; overflow: hidden; } .bar div { height: 100%; width: 0; background: #23955a; }
  code { background: #eef2f7; padding: 1px 5px; border-radius: 4px; }
</style>

<h1>weave.js</h1>

<section>
  <h2>Move an element</h2>
  <p><code>Weave.animate('#box', { x: 240, rotate: 90 }, { preset: 'expressive' })</code></p>
  <button id="go">Go</button> <button id="back">Back</button>
  <div id="box"></div>
</section>

<section>
  <h2>Make things appear</h2>
  <p><code>Weave.enter('.card', { stagger: 0.06 })</code></p>
  <button id="show">Show list</button>
  <div class="card">Container 1</div><div class="card">Container 2</div><div class="card">Container 3</div><div class="card">Container 4</div>
</section>

<section>
  <h2>Animate a number</h2>
  <p><code>Weave.spring(0, v => ...).to(80)</code></p>
  <button data-to="20">20%</button> <button data-to="80">80%</button> <button data-to="100">100%</button>
  <p><b id="pct">0</b> %</p>
  <div class="bar"><div id="fill"></div></div>
</section>

<script src="../weave.js"></script>
<script>
  document.getElementById('go').onclick = () => Weave.animate('#box', { x: 240, rotate: 90 }, { preset: 'expressive' });
  document.getElementById('back').onclick = () => Weave.animate('#box', { x: 0, rotate: 0 }, { preset: 'expressive' });
  document.getElementById('show').onclick = () => Weave.enter('.card', { stagger: 0.06 });

  const pct = document.getElementById('pct'), fill = document.getElementById('fill');
  const value = Weave.spring(0, v => { pct.textContent = Math.round(v); fill.style.width = v + '%'; });
  document.querySelectorAll('[data-to]').forEach(b => b.onclick = () => value.to(+b.dataset.to));
</script>
