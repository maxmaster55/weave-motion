[package]
name = "weave-core"
description = "Renderer-independent motion primitives: exact-time damped springs, tweens, motion tokens and a shared scheduler."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["std"]
# `std` is optional so the crate can be used in `no_std` environments
# (embedded, WASM without std shims, custom engines). `alloc` is always
# required because the scheduler stores collections.
std = []

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
