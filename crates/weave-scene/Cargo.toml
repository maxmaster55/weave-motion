[package]
name = "weave-scene"
description = "Stable element identity, FLIP layout transitions and choreography for the Weave engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = ["std"]
std = []

[dependencies]
weave-core = { workspace = true, default-features = false }
weave-geometry = { workspace = true, default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
