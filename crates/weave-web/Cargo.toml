[package]
name = "weave-web"
description = "Web (wasm/DOM) rendering adapter for the Weave motion engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
default = []
# The DOM bindings are optional: the style computation works everywhere and
# is what the tests cover.
web = ["dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]

[dependencies]
weave-core = { workspace = true, features = ["std"] }
weave-geometry = { workspace = true, features = ["std"] }
weave-scene = { workspace = true, features = ["std"] }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "CssStyleDeclaration",
    "Document",
    "Element",
    "HtmlElement",
    "Window",
] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
